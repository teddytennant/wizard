[package]
name = "wizard"
version = "2.1.2"
edition = "2024"
# `AND`, not `OR`. This is not a dual-licensed crate offering the recipient a
# choice: Wizard's own code is MIT, and the terminal-UI ports listed in NOTICE
# (`src/ui/codex.rs`, `src/ui/grok.rs`, `src/ui/mod.rs`, `src/skin/blend.rs`,
# `src/skin/motion.rs`, `src/skin/layout.rs`) came from Apache-2.0 upstreams and
# stay under Apache-2.0 wherever they go. A binary built from this tree
# therefore carries both sets of terms at once, and both license files ship
# beside it: LICENSE-MIT and LICENSE-APACHE.
# Apache-2.0 section 4(a) requires that the recipient of a
# derivative work be *given* a copy of the license, which is why LICENSE-APACHE
# is a file in the tree rather than a URL in NOTICE.
license = "MIT AND Apache-2.0"
description = "One line. Your sovereign agent. Self-extending. Bring any model."
repository = "https://github.com/teddytennant/wizard"
# There is no separate project website — the README, the docs/ directory and the
# release assets all live in the repository — so this points at the same place
# rather than inventing a domain that would 404 from the crates.io sidebar.
homepage = "https://github.com/teddytennant/wizard"
# Edition 2024 needs 1.85, but that is not the binding constraint: the tree uses
# `if let` chains (for example `RegistryClient::index` in
# `src/registry_client.rs`, which reads the cache age and the cache itself in one
# condition), and those stabilized in 1.88. CI does not pin a toolchain — both
# jobs use `dtolnay/rust-toolchain@stable` — so nothing there would catch a
# feature from a newer release sneaking in; this line is the only floor a
# downstream `cargo install` on an older toolchain gets told about, and it fails
# with "requires rustc 1.88" instead of a page of parse errors.
rust-version = "1.88"
keywords = ["agent", "llm", "cli", "tui", "ai"]
# crates.io rejects a category slug it does not know, so these are four from its
# published list rather than descriptions: the binary is a terminal program
# (`command-line-utilities`) that edits code and drives git (`development-tools`),
# renders and rewrites markdown, diffs and syntax (`text-processing`), and speaks
# to a dozen model providers' HTTP APIs (`api-bindings`).
categories = [
  "command-line-utilities",
  "development-tools",
  "text-processing",
  "api-bindings",
]
# What a `cargo package` tarball does not need. Everything here is media that
# exists for the README and the GitHub social preview, led by `demo/demo.gif` at
# 1.2 MB — over half the crate on its own, downloaded by every `cargo install`
# and never opened by one.
#
# Deliberately narrow, because two things under `assets/` are compiled *into*
# the binary and excluding either breaks the build rather than slimming it:
# `assets/fonts/*.ttf` is `include_bytes!`d by `src/plugins/native/font.rs`, and
# `assets/themes/*.toml` is `include_str!`d by `src/theme.rs`. `build.rs`,
# `WIZARD.md` (`include_str!` in `src/agent/prompts.rs` and `src/tools/manual.rs`)
# and `wizard-release.pub` (`include_str!` in `src/update.rs`) are all load-bearing
# too and stay in. Check for a new `include_bytes!`/`include_str!` before adding a
# line here.
exclude = [
  "demo/",
  "assets/favicon.svg",
  "assets/favicon-*.png",
  "assets/favicon-*.svg",
  "assets/github-social.png",
  "assets/og.png",
  "assets/wizard.svg",
  "assets/wizard-512.png",
  "assets/wizard-mark.png",
]
build = "build.rs"

[features]
# Every backend Wizard ships is a plugin behind one of these, and every one is
# on by default because a stock build has always answered to all nine `kind`
# values and must keep doing so. What being a feature buys is the test: with
# any single one left out the tree still compiles, the suite still passes, and
# that kind resolves to nothing — the error names it and lists what *is*
# installed, instead of a panic or a link error. `--no-default-features` is the
# extreme of that, a wizard with no provider transport linked at all.
#
# The grouping is one feature per *backend*, not per kind: a feature whose
# entire content would be a second `Credentials` variant against the same
# endpoint and the same wire shape is a build flag nobody wants. So `xai`
# carries `xai` and `xaioauth`, and `openai` carries `openai` and `openrouter`.
# See `docs/plugins.md` and `src/plugins/mod.rs`.
default = [
  "acp",
  "fleet",
  "gateway",
  "provider-anthropic",
  "provider-chatgpt",
  "provider-cloudflare",
  "provider-llamacpp",
  "provider-ollama",
  "provider-openai",
  "provider-xai",
  "graph",
  "mesh",
  "tool-web",
  "tool-git",
  "tool-publish",
  "plugin-js",
  "tool-json",
]

# `wizard acp`: the Agent Client Protocol server that lets Zed, Neovim and
# Emacs embed Wizard over stdio. `src/plugins/acp.rs`.
#
# The only plugin feature that gates a *dependency*: `agent-client-protocol` has
# exactly one consumer and a build without this feature does not link the crate
# at all, which is most of what leaving it out is worth. Core keeps parsing the
# subcommand either way — `clap` owns `wizard acp` and `--help` still lists it —
# so an absent server is a sentence naming this flag rather than a missing verb.
acp = ["dep:agent-client-protocol"]

# `wizard fleet`: one planning turn decomposes a mission into independent
# tasks, up to N headless `wizard --mode sovereign` children run them in
# parallel over git worktrees, and a synthesis turn merges the branches back.
# `src/plugins/fleet/`. See docs/fleet.md.
#
# What stays in core when this is left out is what other things use or would
# use: `src/git_util.rs` (async git plumbing), `progress::fleet_bars` (a
# progress *style*, and styles live in one file), and `[fleet]` in
# `config.toml`, which follows `[web]` — a config section is a promise about
# what this process does, and a build without the plugin still parses and
# round-trips one rather than rejecting somebody's file over a section it
# cannot run.
fleet = []

# `wizard --gateway` and `wizard gateway <verb>`: a chat app drives one
# autonomous agent turn per inbound message. `src/plugins/gateway/`. See
# docs/gateway.md.
#
# The first plugin that owns *two* CLI surfaces, which is what turned up the
# limit of `Entrypoint`'s type parameter: the service registry keys on the name
# alone, so the two surfaces are two names rather than one name at two argument
# types. See `entrypoint::GATEWAY_SERVICE`.
#
# What stays in core when this is left out is what the rest of the tree needs
# either way: `[gateway]` in `config.toml` (the `[web]` rule -- a config section
# is a promise about what this process does, and a build without the plugin
# still parses and round-trips one), `credentials::GATEWAY_TOKEN` (onboarding
# writes the bot token whether or not this build can spend it, and a key
# namespace with a feature-shaped hole in it is one two features can collide
# in), `config::group_chat_warning` (doctor and the setup wizard have to say
# the same sentence about the same allow-list), and `Surface::Gateway` in the
# one command dispatcher.
gateway = []

# Anthropic Messages API. `kind = "anthropic"`.
provider-anthropic = []

# ChatGPT subscription via account sign-in. `kind = "chatgptoauth"`.
# Carries its own OAuth client and token store; the loopback redirect it comes
# back on is shared with xAI and stays in core (`llm::oauth_callback`).
provider-chatgpt = []

# Cloudflare Workers AI. `kind = "cloudflare"`.
provider-cloudflare = []

# Local llama.cpp `llama-server`. `kind = "llamacpp"`. This is the backend
# `Config::active` synthesizes when nothing is configured, so a build without
# it starts with a configured provider that resolves to nothing and says so.
provider-llamacpp = []

# Local Ollama, native `/api/chat`. `kind = "ollama"`.
provider-ollama = []

# The OpenAI-compatible family: `kind = "openai"` (which is also how vLLM,
# LM Studio, DeepSeek and the `compat.rs` presets are reached) and
# `kind = "openrouter"`. The wire machinery itself is `llm::wire` and stays in
# core — five backends build on it, so it is infrastructure, not a plugin.
provider-openai = []

# The mesh graph explorer: `MeshGraph` (a `PeerStore` turned into something
# drawable, with liveness decided once and honestly) and a deterministic force
# layout over it. `src/plugins/graph/`.
#
# The only plugin that registers nothing through `Ctx`, because what it
# produces is a data model rather than a tool, a command or a provider; see
# `GraphPlugin`. Its one consumer is the GUI's explorer screen
# (`src/plugins/native/graph/`), which is gated on this feature in step, so a
# build without it is a window with no explorer -- which is the window that
# ships today, since `src/plugins/native/mod.rs` records that screen as deferred
# and not yet reachable.
#
# It enables `mesh` rather than merely assuming it: a `MeshGraph` is built from
# a `PeerStore`, so this is a genuine dependency between two plugins and Cargo
# is where one gets written down. `contrib/check-tool-plugins.sh` has to know
# it too -- dropping `mesh` from the default list leaves `graph` to turn it back
# on, which is what `without_many` there is for.
graph = ["mesh"]

# The P2P mesh: node identity, the QUIC transport and its two certificate
# verifiers, the peer store and its three-state trust decision, mDNS discovery,
# the consent ledger, `wizard peers`, and the session tee that puts a live
# transcript in front of a trusted watcher. `src/plugins/mesh/`.
#
# The largest plugin in the tree and the one with the most crates behind it, so
# leaving it out is the one feature flag that measurably shrinks the binary:
# `dep:quinn` and `dep:mdns-sd` go with it.
#
# `graph` depends on it rather than the other way round — a `MeshGraph` is a
# `PeerStore` turned into something drawable, so the explorer cannot exist
# without the store — which is why the line below is a feature edge and not a
# comment. Cargo has no way to say "optional dependency between plugins", so a
# plugin that needs another names it, exactly as a Lua plugin's
# `optional_deps` would.
mesh = ["dep:quinn", "dep:rustls", "dep:mdns-sd"]

# `web_fetch`, `web_search` and `x_search`. `src/plugins/web.rs`.
#
# The HTTP plumbing under them is *not* here: the client, the SSRF guard, the
# hand-walked redirect chain and the body cap are `src/tools/http.rs` and stay
# in core, because a Lua plugin's `wizard.http` and `generate_image`'s
# downloader are the other two callers and neither has anything to do with
# whether the model can call `web_fetch`. Same split as `llm::wire` against
# `plugins::openai`. Leaving this out costs three tools and nothing else: the
# registry does not hold them, so the model is not told about them.
tool-web = []

# `git_status` and `git_diff`. `src/plugins/lua/git/`, and the first plugin
# that is written in Lua rather than in Rust.
#
# It ships inside the binary — `include_str!` in `src/plugins/bundled.rs` —
# rather than as a file `install.sh` copies to `~/.wizard/plugins`, so it is
# present in a `cargo test`, in a `cargo install`, and in a downloaded release
# alike. That is also what lets it run as `PluginSource::FirstParty`
# (unbounded, JIT on): first-party is a claim about who wrote the code, and it
# is only true of bytes nobody outside this repository can edit.
#
# Leaving it out costs two tools and nothing else: the registry does not hold
# them, so the model is not told about them. `git` itself is still what the
# `/diff` sidebar and the GUI shell out to; those are `src/app/command.rs` and
# `src/plugins/gui/git.rs` and have never gone through the tool.
tool-git = []

# `publish`: fork Wizard to the user's GitHub and hand back a one-line
# installer for their variant. `src/plugins/lua/publish/`, in Lua.
#
# The second Lua plugin, and the first one that is a *whole subsystem* rather
# than a tool wrapper: `src/tools/publish.rs` was a twenty-line adapter over
# `src/evolve/publish.rs`, and both are gone. What is left in Rust is the
# `--publish` flag, the `/publish` command and the three surfaces that print
# what comes back.
#
# Leaving it out costs the `publish` tool, and `wizard --publish` / `/publish`
# then say which feature would bring it back. Nothing else changes: the
# checkout at `~/.wizard/src` is deep evolve's and is still there.
tool-publish = []

# The JavaScript/TypeScript plugin backend: `src/kernel/js/`, one embedded
# QuickJS VM per plugin, a peer of the LuaJIT backend rather than a
# replacement for it.
#
# This is the only plugin feature that is a *language* rather than a
# subsystem. Leaving it out costs no tool and no command on its own — it costs
# the ability to load a `plugin.js` at all, from `~/.wizard/plugins` and from
# `src/plugins/js/`, which is why the bundled JS plugins name it below.
#
# ON by default because it is small. QuickJS is one C file and the whole
# backend adds under a megabyte to a release binary — see `docs/plugins.md`
# for the measurement — which is a different order of magnitude from the
# ~40 MB a V8 embedding costs and therefore does not touch the small-binary
# story `--no-default-features` exists to protect. The `pi` profile can still
# turn it off.
plugin-js = ["dep:rquickjs"]

# `json_query`: pull one value out of a JSON document without spending the
# context window on the rest of it. `src/plugins/js/json/`, and the first
# plugin written in JavaScript.
#
# It depends on `plugin-js` the way `graph` depends on `mesh`: a `plugin.js`
# with no JS backend to load it is not a smaller build, it is a plugin whose
# file is compiled into the binary and never runs. Cargo is where that gets
# written down, and `contrib/check-tool-plugins.sh` has to know it too —
# dropping `plugin-js` from the default list leaves this to turn it back on,
# which is what `without_many` there is for.
tool-json = ["plugin-js"]

# xAI Grok, by API key (`kind = "xai"`) and by account sign-in
# (`kind = "xaioauth"`). The token store and the sign-in flow stay in core:
# `web_search`, `generate_image` and `sync` all use them and have nothing to do
# with which model answers a turn. See `src/plugins/xai.rs`.
provider-xai = []

# The GUI (`wizard gui`): an iced window over the agent core, with no webview,
# no loopback HTTP and no JSON round-trip per streaming token. It is the only
# GUI — the browser one it replaced (axum, a WebSocket and `gui/assets/`) is
# deleted; see `docs/native-gui.md`.
#
# OFF by default: iced is a windowing toolkit, so a default-featured build
# would link winit, a font stack and a rasterizer into every headless
# `wizard -p`, every `wizard acp` and every CI container — several hundred
# crates that a terminal user never executes a line of. It would also break the
# static musl build, because winit reaches X11 and Wayland through `dlopen`,
# and it would put the whole UI layer inside the coverage ratchet
# (`contrib/check-coverage.sh` measures default features), where a widget tree
# that can only be exercised with a compositor would drag the floor down for
# everyone.
#
# So `cargo build` with no features must keep linking no iced at all, and the
# window ships as its *own* release asset: the `native` job in
# `.github/workflows/release.yml` publishes `wizard-native-<target>.tar.gz` for
# the four gnu/darwin targets, and `install.sh WIZARD_NATIVE=1` installs one.
# See `docs/native-gui.md`.
# `src/plugins/gui/` — sessions, config store, git, OAuth — is behind this flag too:
# the window is now the only thing that reaches it.
#
# The name is load-bearing and must not change: `install.sh` reads
# `WIZARD_NATIVE=1`, `.github/workflows/release.yml` has a job called `native`,
# and `docs/native-gui.md` spells it throughout. It is also the one plugin
# feature that is not a provider — the window registers a `wizard gui`
# entrypoint with the kernel and core looks it up by string, so leaving the
# feature out removes the surface without core changing a line. See
# `src/plugins/native/plugin.rs`.
native = ["dep:iced", "dep:iced_highlighter", "dep:iced_test"]

[dependencies]
# NOTE: every dependency here must be a crates.io dependency. `cargo publish`
# refuses any crate that carries a `{ git = ... }` one, so a single such line
# takes `cargo install wizard` (and everything downstream of crates.io, Homebrew
# included) off the table. The /fusion debate engine used to be one; it now
# lives in `src/llm/fusion.rs`.

# Errors
anyhow = "1"
thiserror = "2"

# Async runtime + streams
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
async-trait = "0.1"

# Agent Client Protocol server (`wizard acp`): embeds Wizard in ACP editors
# (Zed, Neovim, Emacs). ACP 2.0 owns stdio via its `Stdio` transport.
# Optional, behind the `acp` feature (on by default): `src/plugins/acp.rs` is
# its only consumer, so a build without that plugin should not link it.
agent-client-protocol = { version = "2.0.0", optional = true }

# Ollama HTTP (rustls so the binary has no OpenSSL link dependency)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# OAuth sign-in (xAI): PKCE hashing, base64url tokens, randomness
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.4"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
shellexpand = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI (crossterm pinned to the version ratatui re-exports)
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }

# Rendering helpers
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
# Inline/display `$math$` → readable Unicode for the TUI (no TeX engine).
unicodeit = "0.2"

# Images in the TUI transcript (`src/image_view.rs`): terminal capability
# detection plus the kitty / sixel / iTerm2 encoders, with unicode half-blocks
# as the universal floor. On the 10.x line to match ratatui 0.30 — 9.x still
# pins ratatui 0.29 and would link a second copy, making its widgets untypeable
# against our `Frame`. Default features are off because they pull `chafa` in
# over pkg-config (a C library we will not require to build wizard) and the
# whole of `image`'s codec set; we take exactly the four formats `llm::Image`
# can carry.
ratatui-image = { version = "10", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# Plain-terminal progress (headless turns, fleet, llama-server waits).
# Defaults are minimal (just unicode-width, which the braille frames need).
indicatif = "0.17"

# IDs / timestamps (sessions, evolution log)
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Cron parsing + next-occurrence math (`wizard schedule` / `wizard scheduler`)
croner = "3"

# File matching for list_files / skills discovery
globset = "0.4"

# Copy-on-write (reflink) file cloning for fast fleet worktrees. reflink_or_copy
# falls back to a plain byte copy when the filesystem lacks FICLONE/clonefile.
reflink-copy = "0.1"

# Internal diagnostics. `tracing` is the facade every call site in src/ emits
# through; `tracing-subscriber` is what actually records them, as JSONL under
# ~/.wizard/logs/ (see `crate::logging`). Default features are off on purpose:
# `ansi` and `tracing-log` are dead weight for a sink that must never touch a
# terminal, and dropping `ansi` keeps nu-ansi-term out of the tree entirely.
# What is left is the minimum that sink needs: `fmt` for the layer and the
# registry behind it, `json` for the JSONL formatter, `env-filter` for the
# `WIZARD_LOG` directive syntax.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
  "json",
] }

# Web tools: HTML → markdown for web_fetch, result scraping for web_search
htmd = "0.5"
scraper = "0.27"

# Self-update (`wizard update`): unpack a release tarball (gzip + tar) and
# compare the published version against the running one. Checksums reuse sha2.
flate2 = "1"
tar = "0.4"
semver = "1"
# Release signatures are minisign, which is ed25519 over a blake2b-512 prehash
# of the file rather than a new algorithm: the signature itself is verified by
# the ed25519-dalek below, and this is the one primitive that pulls in. Same
# RustCrypto `digest` traits sha2 already brings, so it adds one crate.
blake2 = "0.10"

# Config/skills sync (`wizard sync`): ed25519 signatures over the bundle
# manifest. Keys are seeded from getrandom — no rand/rand_core dependency.
ed25519-dalek = "3"

# The P2P mesh transport (`src/plugins/mesh/quic.rs`): QUIC with mutual TLS, where the
# certificate's key IS the node's ed25519 identity, so the handshake proves the
# peer id rather than a signature check bolted onto a plaintext socket.
#
# quinn's default feature set is deliberately off. `platform-verifier` drags in
# rustls-platform-verifier and a whole OS trust-store integration for a mesh
# that has no CAs in it at all — every certificate here is self-signed by the
# node it names, and `src/plugins/mesh/tls.rs` is the only verifier. `rustls-ring`
# rather than `rustls-aws-lc-rs` because aws-lc-rs is a C library and this
# project ships static musl builds; ring is already in the tree under reqwest.
#
# Optional, and pulled only by `--features mesh`: quinn, rustls-ring and their
# transport are ~40 crates that a headless `wizard -p` with the mesh switched
# off never executes a line of, and `dep:quinn` is what makes leaving the
# plugin out actually remove them from the build rather than merely stop
# calling them.
quinn = { version = "0.11", optional = true, default-features = false, features = [
  "log",
  "ring",
  "runtime-tokio",
  "rustls-ring",
] }
# Same rustls the reqwest client already links, reached directly for the two
# certificate verifiers the mesh installs in place of a CA chain.
# The mesh is the only direct caller; reqwest links its own copy either way, so
# leaving the plugin out costs no crate here, only the direct edge.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
# Zero-config LAN discovery for the mesh, and the second mechanism rather than
# the first: a pasted address is still how a peer is added, and mDNS grants no
# trust to anything it finds (see src/plugins/mesh/discovery.rs). `default-features =
# false` drops `logging`, which installs an env_logger the crate would then own;
# wizard logs through `tracing` and nothing else. `async` is kept because the
# browse channel is drained from a tokio task that has to be cancellable, which
# a blocking `recv()` is not.
mdns-sd = { version = "0.20", optional = true, default-features = false, features = ["log", "async"] }

# The native GUI (`--features native` only). Every feature here is chosen
# against a dependency that is already in the tree, because the whole point of
# an in-process GUI is that it does not bring a second copy of anything:
#
# `default-features = false` + `tiny-skia` is the load-bearing one. It links no
# wgpu at all — not a runtime fallback, an absent dependency — which is what
# keeps `curl | bash` honest on a box with no Vulkan driver, and what keeps the
# build off the shader toolchain. `cargo tree -i wgpu --features native` must
# stay empty.
#
# `image-without-codecs` rather than `image`: the latter turns on `image`'s
# default feature set, which would undo the four-format selection above
# (`png, jpeg, gif, webp`) that keeps the TIFF/DDS/EXR/AVIF decoders out.
#
# `linux-theme-detection` is deliberately OFF. It is in iced's default set and
# it pulls `mundy`, which runs its D-Bus query on `async-io` — a second,
# smol-flavoured reactor thread alongside the tokio runtime the agent core
# already owns. The theme comes from `crate::theme` anyway (see
# `src/plugins/native/theme.rs`), so the detection would be ignored even if it worked.
#
# `highlighter` reaches syntect through `two-face` with `syntect-default-fancy`,
# which is byte-identical to the selection above: one syntect, fancy-regex, no
# oniguruma and so no C dependency.
#
# `markdown` is deliberately OFF: it pins `pulldown-cmark ^0.12` against the
# 0.13 above, so enabling it links two copies of the parser. Wizard's own
# markdown pipeline feeds `text::Rich` spans instead.
iced = { version = "0.14", optional = true, default-features = false, features = [
  "tiny-skia",
  "x11",
  "wayland",
  "canvas",
  "tokio",
  "image-without-codecs",
  "highlighter",
  "lazy",
  "advanced",
] }
# Reached directly for `Highlighter::new`, which the transcript's code blocks
# drive per-line. Re-exported by iced under the `highlighter` feature, but
# naming it here is what pins the version alongside iced's.
iced_highlighter = { version = "0.14", optional = true }

# Headless UI testing for the window: `Simulator` drives a widget tree with no
# compositor and snapshots it to PNG, and `iced_test::runtime` re-exports the
# `UserInterface` the selection tests drive directly, because
# `Simulator::simulate` hardcodes `clipboard::Null` and so cannot observe a
# copy. Only `src/plugins/native/**` names it, always under `#[cfg(test)]`.
#
# Here rather than in `[dev-dependencies]`, which is where it belongs and where
# it cannot go. Cargo compiles a dev-dependency for every `cargo test` whether
# or not any code under `#[cfg]` names it, so an unconditional entry drags
# `iced_renderer` into a default-feature test build, where it gets no renderer
# backend and hits iced's own `compile_error!`. That breaks `cargo test
# --release` specifically, which is the command deep evolve gates a
# self-authored patch on (`src/evolve/mod.rs`, `TEST_ARGS`) — so every
# self-rebuild would fail on an error that has nothing to do with the patch.
# `optional` is the fix and `[dev-dependencies]` forbids it ("dev-dependencies
# are not allowed to be optional"), so it moves up here and `native` turns it
# on. A `native` release build compiles the crate and links none of it.
iced_test = { version = "0.14", optional = true }

# Embedded LuaJIT for self-extension: scripted tools and evolve glue run through
# the just-in-time compiler in-process. Vendored so the binary has no system
# libluajit dependency; `send` so Lua handles can cross await points.
mlua = { version = "0.12", default-features = false, features = ["luajit", "vendored", "send", "serialize", "async"] }

# Embedded QuickJS for the JavaScript/TypeScript plugin backend, behind
# `plugin-js`. Optional, so a build without that feature links no JS engine at
# all — which is what makes the feature removable in the sense
# `docs/plugins.md` means by the word.
#
# The feature list is short on purpose and two absences are the sandbox rather
# than an oversight. `loader` is QuickJS's module resolver and `dyn-load` is
# its native-library loader — `package.loadlib` under another name — so
# neither is enabled and `import` has nothing to resolve against. See
# `src/kernel/js/host.rs`, which enumerates the rest. `parallel` is what makes
# an `AsyncRuntime` `Send`, which is what lets a plugin's VM live on a
# `tokio::spawn`ed task exactly as a Lua plugin's does, and `futures` is what
# makes a host call awaitable from straight-line JavaScript.
rquickjs = { version = "0.12", default-features = false, features = ["std", "futures", "parallel", "classes", "properties", "array-buffer", "macro"], optional = true }

# Process-group kill for background tasks (`task_kill`, timeouts)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS desktop control for the `computer` tool: CoreGraphics is how you
# synthesise mouse and keyboard events and read the display, behind the
# Accessibility and Screen Recording permissions (`src/tools/computer/macos.rs`).
#
# Target-gated because it must not reach the Linux or Windows builds at all:
# the Linux backend shells out to X11/Wayland helpers instead, and an
# unconditional dependency would put a macOS-only system framework in the
# static musl link. `src/tools/computer/macos.rs` is `cfg(target_os = "macos")`
# on the Rust side, so a Linux build compiles clean whether or not this line is
# here — which is exactly why it is easy to forget and why macOS is the only
# target that would notice.
#
# `highsierra` is not optional here despite the name: `CGEvent::new_scroll_event`
# — the whole of the scroll action — sits behind that feature, and nothing else
# in the graph turns it on, so a default-featured build fails to compile
# `macos.rs` rather than merely losing scrolling. The feature gates the
# non-variadic `CGEventCreateScrollWheelEvent2`, which has been present since
# macOS 10.13; the deployment target is well past that.
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# `iced_test` is not here: it is optional and lives under `[dependencies]`,
# because a dev-dependency cannot be optional and an unconditional one breaks
# `cargo test --release` without `native`. See the note at its entry.

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3

