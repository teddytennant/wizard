[package]
name = "wizard"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "One line. Your sovereign agent. Self-extending. Fully local."
repository = "https://github.com/teddytennant/wizard"

[dependencies]
# Errors
anyhow = "1"

# Async runtime + streams (the bridge subprocess + the TUI event loop)
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
shellexpand = "3"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI (crossterm pinned to the version ratatui re-exports)
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# Rendering helpers
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"

# Debug traces (~/.wizard/logs/)
tracing = "0.1"

# xAI OAuth sign-in: HTTPS to auth.x.ai (rustls so no OpenSSL link), PKCE
# hashing, base64url tokens, and CSPRNG randomness.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = 3
