# Temporary. Finds a toolchain configuration that produces a genuinely static
# x86_64-unknown-linux-musl binary, which release.yml has never managed on a
# hosted runner (see the long note on its `Check the musl binary is actually
# static` step). Four candidates, one control, all reporting the same fact:
# does the binary have a PT_INTERP program header.
#
# Delete this file once release.yml has been moved onto the winner.
name: musl probe

on:
  workflow_dispatch:
  push:
    branches: [musl-static-probe]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  ubuntu:
    name: probe (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # What release.yml does today. Expected to come back NOT static; it
          # is here so a run where everything reports static is recognisable as
          # a broken probe rather than a fix.
          - name: baseline
            cc: musl-gcc
            linker: musl-gcc
            rustflags: -C target-feature=+crt-static
          # musl-gcc still compiles the C (LuaJIT, ring), but rustc drives the
          # link itself. musl-gcc is a specs wrapper around the host gcc, and
          # the specs inject a -dynamic-linker; this takes them out of the link
          # without taking musl's headers out of the compile.
          - name: no-linker-override
            cc: musl-gcc
            linker: ''
            rustflags: -C target-feature=+crt-static
          # The same, said explicitly: rustc's own bundled musl CRT objects
          # and libc.a rather than whatever the driver finds.
          - name: self-contained
            cc: musl-gcc
            linker: ''
            rustflags: -C target-feature=+crt-static -C link-self-contained=yes
          # No musl toolchain at all. Cheapest configuration if it works, and
          # the one that tells us whether musl-tools was ever load-bearing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned by digest, so `toolchain` has to be spelled out: this action
      # reads the toolchain from the ref it was called by, and a digest is not
      # a version. The `stable` branch defaults the input, the v1 tag does not.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.name }}

      - name: Install musl tooling
        if: matrix.cc != ''
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y musl-tools binutils
          for tool in ar strip ranlib; do
            if ! command -v "musl-$tool" >/dev/null 2>&1; then
              sudo ln -sf "$(command -v "$tool")" "/usr/local/bin/musl-$tool"
            fi
          done
          musl-gcc --version
          echo "--- specs ---"
          musl-gcc -dumpspecs 2>/dev/null | grep -A 2 -i "dynamic.linker" || echo "(no dynamic-linker line in specs)"

      # The overrides are exported from the shell rather than declared in
      # `env:`, because an empty `env:` value is set-and-empty rather than
      # absent: cargo answers a set-but-empty linker with "couldn't extract
      # file stem from specified linker", which is how the first run of this
      # probe managed to not test the two candidates it exists for.
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          PROBE_CC: ${{ matrix.cc }}
          PROBE_LINKER: ${{ matrix.linker }}
        run: |
          set -eu
          if [ -n "$PROBE_CC" ]; then
            export CC_x86_64_unknown_linux_musl="$PROBE_CC"
          fi
          if [ -n "$PROBE_LINKER" ]; then
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$PROBE_LINKER"
          fi
          env | grep -E '^(RUSTFLAGS|CC_x86_64|CARGO_TARGET_X86_64)' || true
          cargo build --release --locked --target "$TARGET"

      - name: Static?
        run: |
          set -eu
          bin="target/${TARGET}/release/wizard"
          file "$bin"
          if readelf -l "$bin" | grep -q INTERP; then
            interp="$(readelf -l "$bin" | grep -i 'Requesting program interpreter' | sed 's/.*: //; s/\]//')"
            echo "::warning::${{ matrix.name }}: NOT static, requests ${interp}"
            echo "${{ matrix.name }}: NOT static (${interp})" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "${{ matrix.name }}: genuinely static" >>"$GITHUB_STEP_SUMMARY"

      - name: Does it start under Alpine's loader?
        run: |
          set -eu
          docker run --rm -v "$PWD/target/${TARGET}/release:/out:ro" alpine:3.20 /out/wizard --version
