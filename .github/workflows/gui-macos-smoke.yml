name: GUI install smoke

# Builds Wizard GUI, installs agents the way its Install button does from the
# environment a Dock or desktop-launcher start gets (empty HOME, launchd's
# PATH, no terminal), and on macOS launches the packaged app on the runner's
# desktop session and screenshots it. The update jobs build the app twice,
# the second time with a newer version, serve that as a signed release from a
# local HTTPS feed, and check the first build updates itself to it. Manual, or
# on pushes to the branches that carry GUI install and update work.
on:
  workflow_dispatch:
  push:
    branches: [gui-macos-fixes, gui-self-update]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: gui

jobs:
  macos:
    name: Install smoke and app launch (macos arm64)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui
      - name: Package
        run: scripts/package-macos.sh
      - name: Bundle, dock and dmg names
        run: |
          set -eux
          app="target/package/Wizard GUI.app"
          plutil -p "$app/Contents/Info.plist"
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleName)" = "Wizard GUI"
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleDisplayName)" = "Wizard GUI"
          test -x "$app/Contents/MacOS/wizard-gui"
          test -f "$app/Contents/Resources/wizard-gui.icns"
          codesign --verify --verbose "$app"
          dmg="$(ls target/package/*.dmg)"
          hdiutil attach -nobrowse -readonly "$dmg"
          ls -la "/Volumes/Wizard GUI"
          test -d "/Volumes/Wizard GUI/Wizard GUI.app"
          hdiutil detach "/Volumes/Wizard GUI"
      - name: Install Pi, Claude Code and Wizard from a launchd environment
        env:
          HIDE_NODE: /opt/homebrew/bin /usr/local/bin
        run: |
          scripts/install-smoke.sh target/release/zeron "$RUNNER_TEMP/smoke" \
            pi pi-no-shell claude-code wizard pi-no-node
      - name: Harness install tests on macOS
        run: cargo test --locked -p zeron-harness --lib -- install_progress gui_path node_bootstrap "install::"
      - name: Launch the app and walk onboarding
        env:
          STEPS: |
            wait 3
            shot 02-welcome
            clickc 193 58 03-get-started
            burst 04-agents 2
            clickc 209 38 05-install-pi
            burst 06-pi 8
            wait 20
            shot 07-pi-done
            clickc 209 110 08-install-claude
            burst 09-claude 10
            wait 30
            shot 10-claude-done
        run: |
          cp -R "target/package/Wizard GUI.app" /Applications/
          scripts/macos-gui-smoke.sh "/Applications/Wizard GUI.app" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: macos-smoke
          path: |
            ${{ runner.temp }}/smoke
            ${{ runner.temp }}/shots

  linux:
    name: Install smoke (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: gpui system libraries
        run: |
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui
      - name: Package
        run: |
          PROFILE=debug scripts/package-linux.sh
          tar -tzf target/package/wizard-gui-*-linux-*.tar.gz
      - name: Install Pi, Claude Code and Wizard from a desktop-launcher environment
        env:
          HIDE_NODE: /usr/local/bin /usr/bin
        run: |
          command -v node && node --version || true
          scripts/install-smoke.sh target/debug/zeron "$RUNNER_TEMP/smoke" \
            pi pi-no-shell claude-code wizard pi-no-node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linux-smoke
          path: ${{ runner.temp }}/smoke

  # Both update jobs build with WIZARD_GUI_TEST_RELEASE_KEY, so the app trusts
  # a key generated here instead of Wizard's, and accepts WIZARD_GUI_TEST_CA
  # for the local feed's certificate. Release builds never set either.
  update-linux:
    name: Self-update (linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FEED: ${{ github.workspace }}/../feed
      PKG: ${{ github.workspace }}/../pkg
      NEW: 99.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: gpui system libraries and test tools
        run: |
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev \
            minisign xvfb xdotool imagemagick mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui
      - name: Throwaway release key and TLS certificate
        run: scripts/update-smoke-feed.sh keys "$FEED"
      - name: Package the running version and a newer one
        env:
          WIZARD_GUI_TEST_RELEASE_KEY: ${{ github.workspace }}/../feed/test.pub
        run: |
          set -eux
          old="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "OLD=$old" >>"$GITHUB_ENV"
          mkdir -p "$PKG"
          PROFILE=debug scripts/package-linux.sh
          mv "target/package/wizard-gui-$old-linux-x86_64.tar.gz" "$PKG/"
          perl -0pi -e "s/^version = \"\Q$old\E\"/version = \"$NEW\"/m" Cargo.toml
          grep -m1 '^version' Cargo.toml
          PROFILE=debug scripts/package-linux.sh
          mv "target/package/wizard-gui-$NEW-linux-x86_64.tar.gz" "$PKG/"
          git checkout Cargo.toml Cargo.lock
      - name: Install the running version
        run: |
          set -eux
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          tar -xzf "$PKG/wizard-gui-$OLD-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/wizard-gui-$OLD-linux-x86_64/install.sh"
          ls -la "$HOME/.local/bin" "$HOME/.local/share/wizard-gui"
          test "$(readlink "$HOME/.local/share/wizard-gui/current")" = "$OLD"
          "$HOME/.local/bin/wizard-gui" --version
      - name: A release signed by another key is refused
        run: |
          set -eux
          KEY=other scripts/update-smoke-feed.sh publish "$FEED" "$NEW" "$PKG/wizard-gui-$NEW-linux-x86_64.tar.gz"
          scripts/update-smoke-feed.sh serve "$FEED"
          export HOME="$RUNNER_TEMP/home" WIZARD_GUI_RELEASES_URL=https://127.0.0.1:8443/releases WIZARD_GUI_TEST_CA="$FEED/ca.pem"
          if "$HOME/.local/bin/wizard-gui" update >"$RUNNER_TEMP/refused.txt" 2>&1; then
            cat "$RUNNER_TEMP/refused.txt"
            echo "::error::installed a release signed by the wrong key"
            exit 1
          fi
          cat "$RUNNER_TEMP/refused.txt"
          grep -q "signed by key" "$RUNNER_TEMP/refused.txt"
          test "$(readlink "$HOME/.local/share/wizard-gui/current")" = "$OLD"
          test ! -e "$HOME/.local/share/wizard-gui/$NEW"
      - name: wizard-gui update installs the signed release
        run: |
          set -eux
          scripts/update-smoke-feed.sh publish "$FEED" "$NEW" "$PKG/wizard-gui-$NEW-linux-x86_64.tar.gz"
          export HOME="$RUNNER_TEMP/home" WIZARD_GUI_RELEASES_URL=https://127.0.0.1:8443/releases WIZARD_GUI_TEST_CA="$FEED/ca.pem"
          set +e
          "$HOME/.local/bin/wizard-gui" update --check
          test $? -eq 1 || exit 1
          set -e
          "$HOME/.local/bin/wizard-gui" update
          ls -la "$HOME/.local/share/wizard-gui"
          test "$(readlink "$HOME/.local/share/wizard-gui/current")" = "$NEW"
          test -x "$HOME/.local/share/wizard-gui/$OLD/wizard-gui"
          "$HOME/.local/bin/wizard-gui" --version | grep -x "zeron $NEW"
      - name: The app updates itself from the banner and relaunches
        run: |
          set -eux
          export HOME="$RUNNER_TEMP/home"
          # Back to the old version, the way a fresh install would be.
          "$RUNNER_TEMP/wizard-gui-$OLD-linux-x86_64/install.sh"
          rm -rf "$HOME/.local/share/wizard-gui/$NEW"
          Xvfb :99 -screen 0 1440x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          sleep 2
          scripts/update-smoke-app.sh linux "$HOME/.local/bin/wizard-gui" "$FEED" "$NEW" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: linux-update
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/home/.zeron/logs
            ${{ runner.temp }}/refused.txt

  update-macos:
    name: Self-update (macos arm64)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      FEED: ${{ github.workspace }}/../feed
      PKG: ${{ github.workspace }}/../pkg
      NEW: 99.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: gui
      - name: Test tools
        run: brew install --quiet minisign cliclick
      - name: Throwaway release key and TLS certificate
        run: scripts/update-smoke-feed.sh keys "$FEED"
      - name: Package the running version and a newer one
        env:
          WIZARD_GUI_TEST_RELEASE_KEY: ${{ github.workspace }}/../feed/test.pub
        run: |
          set -eux
          old="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "OLD=$old" >>"$GITHUB_ENV"
          mkdir -p "$PKG"
          PROFILE=debug scripts/package-macos.sh
          cp -R "target/package/Wizard GUI.app" /Applications/
          perl -0pi -e "s/^version = \"\Q$old\E\"/version = \"$NEW\"/m" Cargo.toml
          grep -m1 '^version' Cargo.toml
          PROFILE=debug scripts/package-macos.sh
          mv "target/package/zeron-$NEW-macos-arm64.dmg" "$PKG/wizard-gui-$NEW-macos-arm64.dmg"
          git checkout Cargo.toml Cargo.lock
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "/Applications/Wizard GUI.app/Contents/Info.plist"
      - name: Serve the newer version as a signed release
        run: |
          scripts/update-smoke-feed.sh publish "$FEED" "$NEW" "$PKG/wizard-gui-$NEW-macos-arm64.dmg"
          scripts/update-smoke-feed.sh serve "$FEED"
      - name: The app updates itself from the banner and relaunches
        run: scripts/update-smoke-app.sh macos "/Applications/Wizard GUI.app" "$FEED" "$NEW" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: macos-update
          path: |
            ${{ runner.temp }}/shots
            ~/.zeron/logs
