name: Release

on:
  push:
    tags: ['v*']

# Read at the top, write on exactly two jobs. Ten of the thirteen jobs here only
# compile and upload build artifacts (artifact storage is a separate scope and
# needs nothing from `contents`), so the only steps that write to the
# repository are the one that creates the release and the one that commits the
# AUR bump afterwards. A token that can write releases is handed to every
# `cargo build` in the matrix otherwise, including the ones that run
# third-party build scripts from the dependency tree.
#
# The same argument one layer down: every checkout sets `persist-credentials:
# false`, so the token is not sitting in `.git/config` while those build
# scripts run in that directory. Nothing here runs git after the checkout.
permissions:
  contents: read

# One release at a time. Two tags pushed close together otherwise race on the
# mirror's `latest/` prefix, which is a shared mutable location: the loser
# finishes second and leaves `latest/` describing the older release. NOT
# `cancel-in-progress` — a half-cancelled release is worse than a queued one,
# because the GitHub release is already public by the time the mirror step
# runs.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# No `Swatinem/rust-cache` in this file, deliberately. The Actions cache is
# writable by any run on any branch of this repo, and a restored entry lands in
# `target/` and `~/.cargo` before rustc reads them, so a cache written by an
# ordinary push to main is an input to the binaries this workflow signs. CI
# throws its build products away and keeps its caches; here it is the other way
# round. A tag builds cold, which costs a few minutes per release and takes a
# mutable shared input out of the path to a signed asset.

jobs:
  # A tag that disagrees with Cargo.toml is cheap to catch and expensive to
  # discover after six uploads. Its own job, on one runner, needing nothing but
  # a checkout: as a step inside the `test` matrix it ran once per runner, so a
  # mismatched tag failed twice with the same annotation and the second failure
  # waited on whatever queue that runner was in. Everything below checks out
  # the same tag, so checking it once here covers them all.
  version:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} (version ${tag_version}) does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          # The GUI's assets are published under the tag's version, and its
          # updater compares that with its own. A GUI one version behind would
          # offer the same release as an update forever.
          gui_version="$(grep -m1 '^version' gui/Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          if [ "$gui_version" != "$cargo_version" ]; then
            echo "::error::gui/Cargo.toml version ${gui_version} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "Releasing version ${cargo_version}"

      # The same refusal the `release` job makes before publishing, made here
      # first because of what it costs there. Down at the signing step this
      # fires only after the full matrix — six builds, two of them on
      # macOS — has already been paid for. The answer cannot change
      # in between: both read the committed wizard-release.pub at the same
      # tag. So a tag pushed with the placeholder still in the repo fails in
      # about a runner-minute instead of an hour.
      #
      # This does NOT replace the check at signing time, which stays the
      # authoritative one: it guards the step that actually produces the
      # signature, and a guard that lives only at the front of a pipeline is
      # one refactor away from being skipped.
      - name: Refuse a placeholder signing key early
        run: |
          set -eu
          key="$(grep -v '^untrusted comment:' wizard-release.pub | tr -d '[:space:]')"
          case "$key" in
            RELEASE-SIGNING-KEY-NOT-YET-GENERATED*)
              echo "::error::wizard-release.pub is still the placeholder; generate the release keypair and update install.sh's inlined copy before tagging (see SECURITY.md)" >&2
              exit 1
              ;;
          esac
          echo "A real release signing key is committed."

  # The gate. A tag push used to go straight to `cargo build` and then to a
  # published, non-draft release: nothing between `git tag` and six binaries on
  # the download page ever ran a test or started the binary. Everything below
  # needs this job, so a red suite means no artifacts and no release.
  #
  # Two runners, exactly the platforms that get an asset: this is the shipping
  # gate, not a portability survey. Windows ships nothing, and its port is
  # deferred to a release of its own, which is also why CI no longer carries a
  # Windows leg (see the `suite` job in ci.yml).
  #
  # This runs `cargo test --locked` on macos-15 and blocks, while the identical
  # command in CI's `suite` job is non-blocking until it has been observed
  # green. That is not an inconsistency, it is the two failure modes being
  # different: a red macOS leg here means a tag publishes nothing, which is a
  # deliberate act by one person who can look at it and retag, and shipping
  # Darwin binaries whose suite has never passed is the thing a release gate
  # exists to stop. A red macOS leg on a pull request means nobody can merge
  # anything. Both flip to the same state once the suite is known green there.
  #
  # Only the *suite* is split that way. CI's macOS leg still blocks on
  # `cargo check --locked`, so a Darwin-only compile break is refused at the
  # pull request rather than discovered here, where it would cost a tag that
  # publishes zero of six assets.
  test:
    name: Test suite (${{ matrix.runner }})
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned by digest, so `toolchain` has to be spelled out: this action
      # reads the toolchain from the ref it was called by, and a digest is not
      # a version. The `stable` branch defaults the input, the v1 tag does not.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.target }})
    needs: [test]
    strategy:
      # Don't cancel sibling targets when one fails: their artifacts still
      # upload, so re-running only the broken job completes the release
      # instead of rebuilding every target.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            native: true
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
            native: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            native: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
            native: true
          # Both macOS targets build on Apple Silicon runners (macos-15): the macOS
          # SDK is universal, so x86_64 cross-compiles fine, and we avoid the scarce
          # Intel `macos-13` runners that leave the job stuck in queue for hours.
          # The consequence is that the x86_64 asset cannot be started here
          # (an arm64 runner needs Rosetta 2 for that, and the hosted images do
          # not ship it), so it is the one asset the smoke test below skips.
          - target: x86_64-apple-darwin
            runner: macos-15
            native: false
          - target: aarch64-apple-darwin
            runner: macos-15
            native: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # musl-tools ships exactly two binaries, musl-gcc and musl-ldd. That was
      # enough until this tree grew a vendored LuaJIT (mlua's `luajit` +
      # `vendored` features): luajit-src searches PATH for `musl-ar` and
      # `musl-strip` by name and panics with "cannot find musl-ar" when either
      # is absent. That panic happens in `Build (release)` below, which has no
      # continue-on-error, so the whole `build` job goes red and `release`
      # (needs: [build]) never runs — a tag push would publish nothing
      # at all rather than a bad musl asset.
      #
      # ar and strip are binutils, not libc: the host's operate on musl objects
      # for the runner's own architecture perfectly well, so aliasing them under
      # the names luajit-src looks for is the whole fix. Verified by
      # reproducing both panics in order against this exact dependency, and by
      # confirming `dpkg -L musl-tools` lists only musl-gcc and musl-ldd.
      - name: Install musl tooling
        if: contains(matrix.target, '-musl')
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y musl-tools binutils
          for tool in ar strip ranlib; do
            if ! command -v "musl-$tool" >/dev/null 2>&1; then
              sudo ln -sf "$(command -v "$tool")" "/usr/local/bin/musl-$tool"
            fi
          done
          musl-gcc --version >/dev/null
          command -v musl-ar musl-strip

      - name: Build (release)
        env:
          # Statically link the C runtime for the musl targets so the binary
          # carries no dynamic loader dependency (runs on NixOS/Alpine/old glibc).
          RUSTFLAGS: ${{ contains(matrix.target, '-musl') && '-C target-feature=+crt-static' || '' }}
          # Each musl runner is native (x86_64 runner / arm runner), so musl-tools'
          # `musl-gcc` targets the runner's own arch. Point cc-rs (ring's, LuaJIT's
          # and, since 3.0, QuickJS's C builds) at it; without this they look for a
          # triple-prefixed `<arch>-linux-musl-gcc` that musl-tools does not
          # install, and the build stops at "failed to find tool". These vars
          # are target-scoped, so they're inert on the glibc/darwin jobs.
          #
          # `musl-gcc` compiles the C and does NOT link the binary. It is a
          # specs wrapper around the host gcc, and its specs inject
          # `-dynamic-linker /lib/ld-musl-x86_64.so.1` on any link that is not
          # spelled `-static`. Pointing
          # CARGO_TARGET_<TRIPLE>_LINKER at it, which this used to do, is what
          # put a PT_INTERP into a binary the same job then advertised as
          # static: every published wizard-x86_64-unknown-linux-musl asset up
          # to and including v2.1.1 requests that interpreter and segfaults
          # under Alpine's loader. Leave the link to rustc and it uses its own
          # bundled musl CRT and libc.a, which is what `+crt-static` above is
          # asking for.
          #
          # Measured on hosted runners rather than reasoned about, because the
          # previous three attempts at this were reasoned about: with the
          # override, x86_64 came back `NOT static, requests
          # /lib/ld-musl-x86_64.so.1`; without it, `static-pie linked`, no
          # PT_INTERP, and `wizard --version` runs under alpine:3.20. aarch64
          # was already static with the override and stays static without it.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          strip "target/${{ matrix.target }}/release/wizard"
          tar -C "target/${{ matrix.target }}/release" -czf "wizard-${{ matrix.target }}.tar.gz" wizard

      # Start what we are about to ship. Deliberately the unpacked tarball and
      # not target/release/wizard: strip and tar are the last two things that
      # touch the artifact, and a release that uploads a binary nobody ever ran
      # is how a broken asset reaches users through install.sh instead of here.
      # `--version` is enough: it links, loads, and reaches main.
      #
      # Blocking, as of the linker fix above. It was non-blocking for six
      # releases while the x86_64 musl asset shipped with a PT_INTERP nobody
      # could explain, on the reasoning that a red `build` takes `release` with
      # it and a tag would then publish nothing at all rather than eight good
      # assets and two broken ones. That trade is over: both musl targets are
      # measured static, so a failure here now means a regression, and a
      # regression is exactly what should stop a release.
      #
      # A genuinely static binary has no PT_INTERP program header. Checking for
      # that rather than leaving it to the smoke test below names the defect
      # instead of letting it present as a segfault, and it catches the case
      # where the runner happens to have a loader the user will not.
      - name: Check the musl binary is actually static
        if: contains(matrix.target, '-musl')
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/wizard"
          if readelf -l "$bin" | grep -q INTERP; then
            interp="$(readelf -l "$bin" | grep -i 'Requesting program interpreter' | sed 's/.*: //; s/\]//')"
            echo "::warning::${{ matrix.target }} is NOT static — it requests ${interp}. It will segfault on Alpine and will not run on any host without that loader."
            exit 1
          fi
          echo "${{ matrix.target }} has no PT_INTERP: genuinely static."

      - name: Smoke test the packaged binary
        if: matrix.native
        # The musl legs used to be exempt here too; see the static check above.
        run: |
          set -eu
          rm -rf smoke && mkdir smoke
          tar -xzf "wizard-${{ matrix.target }}.tar.gz" -C smoke
          ./smoke/wizard --version
          rm -rf smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wizard-${{ matrix.target }}
          path: wizard-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    # The only job in this workflow that writes anything. See the workflow-level
    # `permissions` above.
    permissions:
      contents: write
    steps:
      # The checkout is here for one file: wizard-release.pub, the public half
      # of the signing key. The signature below is verified against it before
      # anything is published, so a secret that has drifted from the key users
      # actually carry fails the release instead of shipping six assets nobody
      # can install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `pattern` keeps the desktop app's artifacts (the gui-* jobs below) out
      # of checksums.txt. They build in parallel and may or may not have
      # uploaded by now, and a checksum list whose contents depend on a race
      # is not one worth signing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wizard-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum -- *.tar.gz > checksums.txt

      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      # checksums.txt is the only file that has to be *authentic*: every
      # tarball is verified against it, so signing it signs the release.
      # `install.sh` and `wizard update` both refuse a release whose
      # checksums.txt has no valid signature under the key in
      # wizard-release.pub, with no flag to skip the check, so a tag that
      # reaches this step without a working secret must fail here rather than
      # publish assets that cannot be installed.
      #
      # The secret is the whole `minisign -G` secret key file, verbatim
      # (including its `untrusted comment:` line). Generate it with `-W` so it
      # carries no password: a password on a key whose only user is this
      # runner protects nothing and cannot be typed here anyway.
      - name: Sign checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set; releases must be signed (see SECURITY.md)" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > minisign.key
          minisign -S -s minisign.key -m checksums.txt \
            -c "wizard ${GITHUB_REF_NAME} release checksums" \
            -t "wizard ${GITHUB_REF_NAME} checksums, signed by the wizard release key" \
            </dev/null
          rm -f minisign.key

      # Verify with the *published* key, not with the secret that just signed:
      # this is the step that proves what ships can be checked by what users
      # already have.
      - name: Verify the signature against the published public key
        run: |
          set -eu
          key="$(grep -v '^untrusted comment:' wizard-release.pub | tr -d '[:space:]')"
          case "$key" in
            RELEASE-SIGNING-KEY-NOT-YET-GENERATED*)
              echo "::error::wizard-release.pub is still the placeholder; generate the release keypair before tagging (see SECURITY.md)" >&2
              exit 1
              ;;
          esac
          minisign -Vm checksums.txt -x checksums.txt.minisig -P "$key"

      # `draft: false` publishes the moment this job runs, which is only
      # defensible because of what has to be green first: the tag matching
      # Cargo.toml, the suite on both shipping platforms, then six builds,
      # then every asset that can run on its build runner actually starting,
      # and finally a checksums.txt signature that verifies against the public
      # key in the repository.
      # The two musl assets are the exception, and the only one: their smoke
      # test reports but does not block, for the reason spelled out on that
      # step. Do not add an asset that skips or downgrades the smoke test
      # without saying why there, and do not remove `needs` from the jobs
      # above.
      #
      # `fail_on_unmatched_files: true` because the action's own default is
      # false: an asset named below that does not exist is otherwise skipped
      # and the job still goes green, which would publish a release quietly
      # missing a platform. `if-no-files-found: error` on the uploads makes
      # that unlikely, and unlikely-and-silent is the combination this release
      # can least afford.
      #
      # `preserve_order: true` uploads in the order listed, and checksums.txt
      # and its signature are listed last on purpose. The release is public
      # from the moment this step starts, so during the upload `install.sh`
      # can fetch checksums.txt from releases/latest and then 404 on a tarball
      # it names. Ordering does not close that window — only a draft would —
      # but it means the file that advertises the others arrives after them.
      #
      # `generate_release_notes: true` because without it the body is empty:
      # the six assets appear on the release page with nothing above them, no
      # changelog and no statement about what they are. GitHub builds the
      # changelog from the commits since the previous tag; `body` below is
      # prepended to it.
      #
      # The prepended part is the verification instructions, and they lead
      # rather than trail. Every asset here is covered by a signature over
      # checksums.txt, `install.sh` and `wizard update` both refuse a release
      # whose signature does not check, and somebody who downloads a tarball
      # from this page by hand gets none of that enforcement — they are the one
      # reader who has to run the check themselves, and this is the page they
      # are standing on when they need it.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          preserve_order: true
          generate_release_notes: true
          body: |
            ## Verifying this download

            Every asset below is covered by `checksums.txt`, which is signed
            with the Wizard release key. `install.sh` and `wizard update` check
            that signature and refuse anything that fails it, with no flag to
            skip the check. If you download a tarball from this page by hand,
            that check is yours to run:

            ```sh
            # 1. the signature over checksums.txt, against the key in the repo
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/wizard-release.pub
            minisign -Vm checksums.txt -x checksums.txt.minisig \
              -P "$(grep -v '^untrusted comment:' wizard-release.pub)"

            # 2. then the tarball you actually downloaded, against checksums.txt
            sha256sum --ignore-missing -c checksums.txt
            ```

            Both must pass. The first proves the checksum list is ours; the
            second proves your download matches it. Checking only the second
            proves nothing, because an attacker who can replace the tarball can
            replace the checksum beside it.

            ---
          files: |
            wizard-x86_64-unknown-linux-gnu.tar.gz
            wizard-x86_64-unknown-linux-musl.tar.gz
            wizard-aarch64-unknown-linux-gnu.tar.gz
            wizard-aarch64-unknown-linux-musl.tar.gz
            wizard-x86_64-apple-darwin.tar.gz
            wizard-aarch64-apple-darwin.tar.gz
            checksums.txt
            checksums.txt.minisig

      # ---------------------------------------------------------------------
      # The download mirror (D1.2)
      # ---------------------------------------------------------------------
      #
      # The same artifacts, plus checksums.txt and its signature, copied to
      # Cloudflare R2 so downloads have stable URLs that are not version-shaped
      # the way GitHub's asset URLs are. GitHub stays the source of truth: this
      # runs *after* the release is published, and both `install.sh` and
      # `wizard update` fall back to GitHub on any mirror failure.
      #
      # Secrets, all four required together:
      #   R2_ACCOUNT_ID         Cloudflare account id (the R2 S3 endpoint host)
      #   R2_BUCKET             bucket name, e.g. wizard-dl
      #   R2_ACCESS_KEY_ID      R2 API token, "Object Read & Write" on that bucket
      #   R2_SECRET_ACCESS_KEY  its secret
      #
      # With any of them absent the upload is skipped and the release stands.
      # A release that fails because an *optional* mirror is not configured
      # would make the mirror a single point of failure for the thing it exists
      # to take load off.
      - name: Is the R2 mirror configured?
        id: mirror
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -eu
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${R2_BUCKET:-}" ] \
             && [ -n "${R2_ACCESS_KEY_ID:-}" ] && [ -n "${R2_SECRET_ACCESS_KEY:-}" ]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "configured=false" >>"$GITHUB_OUTPUT"
            echo "R2 mirror not configured; skipping the upload. GitHub Releases is unaffected." \
              >>"$GITHUB_STEP_SUMMARY"
          fi

      # Upload order matters, and it is: every tarball first, then
      # checksums.txt.minisig, then checksums.txt last. A client that finds a
      # checksums.txt has therefore already been able to find everything it
      # names, so an interrupted upload leaves the prefix incomplete rather
      # than internally inconsistent — which matters because a digest that does
      # not match is a *refusal*, not a fallback.
      #
      # That reasoning holds for `<tag>/`, which is empty before this runs. It
      # does NOT hold for `latest/`, which already contains the previous
      # release: there, an interrupted upload leaves the new tarballs beside
      # the *old* checksums.txt, which is exactly the internally-inconsistent
      # state the paragraph above says cannot happen. The blast radius is
      # humans and scripts reading `latest/` by hand — the clients read the
      # tag-pinned prefix and never this one — but do not extend the first
      # paragraph's guarantee to `latest/`, because it is not true there.
      # Re-running an *old* tag's workflow also overwrites `latest/` with the
      # older release, and nothing here prevents that.
      #
      # Two prefixes per release, both with the release's own asset names plus a
      # bare `<target>` alias of each tarball:
      #   /<tag>/wizard-<target>.tar.gz  /<tag>/<target>       what the clients read
      #   /latest/wizard-<target>.tar.gz /latest/<target>      for humans and scripts
      # The clients only ever read the version-pinned prefix (the tag comes from
      # GitHub), so the mutable `latest/` prefix cannot pin anyone to an old
      # release. Budget: roughly 2x the release's asset size per tag, against
      # R2's 10 GB free tier — prune old tags with a lifecycle rule rather than
      # discovering the ceiling.
      - name: Upload the release to the R2 mirror
        if: steps.mirror.outputs.configured == 'true'
        # The GitHub release is already published at this point, so a mirror
        # that refuses the upload must not retroactively fail the release. It
        # still reports: a mirror silently a version behind is worse than one
        # that is visibly missing a release.
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the streaming checksum trailers the AWS CLI has sent by
          # default since v2.23, so ask for them only where the S3 API requires
          # them. Without this every upload fails with a 501.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -eu
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          put() {
            aws s3 cp --only-show-errors --endpoint-url "$endpoint" "$1" "s3://${R2_BUCKET}/$2"
          }
          for prefix in "${GITHUB_REF_NAME}" latest; do
            for tarball in wizard-*.tar.gz; do
              target="${tarball#wizard-}"
              target="${target%.tar.gz}"
              put "$tarball" "${prefix}/${tarball}"
              put "$tarball" "${prefix}/${target}"
            done
            put checksums.txt.minisig "${prefix}/checksums.txt.minisig"
            put checksums.txt "${prefix}/checksums.txt"
          done
          echo "Mirrored ${GITHUB_REF_NAME} to R2 (${R2_BUCKET}): /${GITHUB_REF_NAME}/ and /latest/" \
            >>"$GITHUB_STEP_SUMMARY"

  # Runs after the release is public, so a failure here never takes a release
  # down with it. It only edits packaging metadata: the tap formula and the
  # AUR files under contrib/aur, both rendered from checksums.txt.
  packaging:
    name: Update Homebrew tap and AUR files
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Fetch the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
      - name: Point the AUR files at this release
        run: contrib/aur/bump.sh "$GITHUB_REF_NAME" checksums.txt
      - name: Commit the AUR bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          git add contrib/aur
          if git diff --cached --quiet; then
            echo "contrib/aur already points at ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Point the AUR files at ${GITHUB_REF_NAME}"
          # Anything merged to main since checkout would make the push a non-fast-forward.
          git pull --rebase "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" "${BRANCH}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:${BRANCH}"
      # The AUR push stays off until there is an AUR account. Once there is:
      # add its ssh public key on aur.archlinux.org, `gh secret set AUR_SSH_KEY
      # < ~/.ssh/aur`, check the host key against the fingerprints published on
      # https://aur.archlinux.org, then uncomment this step. It publishes the
      # two files bump.sh just committed, nothing else.
      # - name: Push to the AUR
      #   env:
      #     AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      #   run: |
      #     set -eu
      #     mkdir -p ~/.ssh && chmod 700 ~/.ssh
      #     printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
      #     ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
      #     export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"
      #     for pkg in wizard-bin wizard; do
      #       git clone "ssh://aur@aur.archlinux.org/${pkg}.git" "aur-${pkg}"
      #       cp "contrib/aur/${pkg}/PKGBUILD" "contrib/aur/${pkg}/.SRCINFO" "aur-${pkg}/"
      #       git -C "aur-${pkg}" add PKGBUILD .SRCINFO
      #       git -C "aur-${pkg}" -c user.name="Teddy Tennant" -c user.email="teddytennant@icloud.com" \
      #         commit -m "Update to ${GITHUB_REF_NAME#v}"
      #       git -C "aur-${pkg}" push
      #     done
      - name: Rewrite the tap formula
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -z "${TAP_GITHUB_TOKEN}" ]; then
            echo "::error::TAP_GITHUB_TOKEN is not set, so teddytennant/homebrew-tap still serves the previous release. Create a fine-grained PAT scoped to homebrew-tap with Contents: read and write, then: gh secret set TAP_GITHUB_TOKEN --repo ${GITHUB_REPOSITORY}" >&2
            exit 1
          fi
          git clone --depth 1 https://github.com/teddytennant/homebrew-tap tap
          contrib/homebrew/formula.sh "$GITHUB_REF_NAME" checksums.txt > wizard.rb.new
          mv wizard.rb.new tap/Formula/wizard.rb
          cd tap
          git add Formula/wizard.rb
          if git diff --cached --quiet; then
            echo "tap already at ${GITHUB_REF_NAME}"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "wizard ${GITHUB_REF_NAME#v}"
          git push "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/teddytennant/homebrew-tap" HEAD:main
          echo "Tap formula now at ${GITHUB_REF_NAME}" >>"$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Wizard GUI (gui/), the desktop app
  # ---------------------------------------------------------------------
  #
  # Built from the same tag and attached to the same release, but kept off
  # the wizard binary's path: none of these jobs is in `release`'s needs, and
  # their artifacts are named gui-* so `release` never downloads them. A GUI
  # build that breaks costs the GUI assets, not the release. They start after
  # `version` so a mismatched tag builds nothing.
  #
  # No rust-cache here either, for the reason at the top of this file.
  gui-linux:
    name: GUI build (linux ${{ matrix.arch }})
    needs: [version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: gpui system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Package
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-linux-${{ matrix.arch }}
          path: gui/target/package/*.tar.gz
          if-no-files-found: error

  # Signing and notarization are optional. With no MACOS_CERT_P12 the app is
  # ad-hoc signed and Gatekeeper asks on first launch; gui/README.md says so.
  #   MACOS_CERT_P12 / MACOS_CERT_PASSWORD: base64 Developer ID Application
  #     .p12 and its export password.
  #   AC_API_KEY_P8 / AC_API_KEY_ID / AC_API_ISSUER_ID: App Store Connect API
  #     key for notarytool. All three present means notarize and staple.
  gui-macos:
    name: GUI build (macos arm64)
    needs: [version]
    runs-on: macos-15
    defaults:
      run:
        working-directory: gui
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Import the Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: Notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: Package
        run: scripts/package-macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-macos-arm64
          path: gui/target/package/*.dmg
          if-no-files-found: error

  gui-windows:
    name: GUI build (windows x86_64)
    needs: [version]
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - name: Locate the Windows SDK shader compiler
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/bin/*/x64/fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'Windows SDK fxc.exe is required for GPUI release shaders' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      # zeron-update.json marks the unpacked zip as the portable install the
      # in-app updater may replace; the updater itself reads GitHub releases.
      - name: Package
        run: ./scripts/package-windows.ps1 -ReleasesUrl "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gui-windows-x86_64
          path: gui/target/package/*.zip
          if-no-files-found: error

  # Attaches the GUI to the release `release` created, under wizard's
  # version rather than the app's internal one, with its own checksum list
  # signed by the same key as checksums.txt.
  gui-release:
    name: Attach Wizard GUI to the release
    needs: [release, gui-linux, gui-macos, gui-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gui-*
          path: gui-dist
          merge-multiple: true
      - name: Name the assets after this release
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          mkdir out
          for f in gui-dist/*; do
            base="$(basename "$f")"
            # {zeron,wizard-gui}-<app version>-<platform>.<ext> -> wizard-gui-<ver>-<platform>.<ext>
            platform="$(printf '%s' "$base" | sed -E 's/^(zeron|wizard-gui)-[0-9][^-]*-//')"
            cp "$f" "out/wizard-gui-${ver}-${platform}"
          done
          ls -l out
          for want in linux-x86_64.tar.gz linux-aarch64.tar.gz macos-arm64.dmg windows-x86_64.zip; do
            test -f "out/wizard-gui-${ver}-${want}" || { echo "::error::missing wizard-gui-${ver}-${want}" >&2; exit 1; }
          done
          (cd out && sha256sum -- * > gui-checksums.txt)
      - name: Sign the GUI checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > minisign.key
          minisign -S -s minisign.key -m out/gui-checksums.txt \
            -c "wizard ${GITHUB_REF_NAME} gui checksums" \
            -t "wizard ${GITHUB_REF_NAME} gui checksums, signed by the wizard release key" \
            </dev/null
          rm -f minisign.key
          key="$(grep -v '^untrusted comment:' wizard-release.pub | tr -d '[:space:]')"
          minisign -Vm out/gui-checksums.txt -x out/gui-checksums.txt.minisig -P "$key"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber

  # ---------------------------------------------------------------------
  # Wizard for Android (android/)
  # ---------------------------------------------------------------------
  #
  # Same arrangement as the GUI: built from the tag, attached to the release
  # `release` created, kept off the wizard binary's path. The artifact is named
  # android-apk, which neither `wizard-*` nor `gui-*` matches, so it lands in
  # neither of those checksum lists. A broken Android build costs the APK, not
  # the release.
  #
  # The asset names are an interface. android/README.md sends people to
  # releases/latest/download/wizard-android.apk, so every release has to carry
  # an asset by exactly that name or the link 404s the moment the release
  # becomes latest. wizard-android-<version>.apk is the same file under a name
  # that says which one it is.
  #
  # Signing secrets, all four required:
  #   ANDROID_KEYSTORE_B64       the keystore file (PKCS12 or JKS), base64
  #   ANDROID_KEYSTORE_PASSWORD  its store password
  #   ANDROID_KEY_ALIAS          the key's alias in it
  #   ANDROID_KEY_PASSWORD       the key's password (a PKCS12 keystore from
  #                              keytool uses the store password for both)
  # That key is the app's identity for good: Android installs an update only
  # if it is signed by the key that signed the installed copy, so a lost or
  # replaced keystore means every user uninstalls and starts over.
  android-build:
    name: Android APK
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # gradlew starts by running the committed gradle-wrapper.jar, and it runs
      # it with the keystore and its passwords in reach. Check that jar is one
      # Gradle published before handing it anything.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # No `cache: gradle`, for the reason there is no rust-cache in this file:
      # a restored ~/.gradle is plugin and dependency jars that run inside the
      # build that signs the APK, written by whatever ran on any branch.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      # The versions android/flake.nix pins, so the release builds against the
      # SDK the app is developed against, not whatever the runner image has.
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platforms;android-37.0 build-tools;36.1.0'
          log-accepted-android-sdk-licenses: false

      # Fails rather than skipping. An APK signed with anything else cannot
      # update the one people already have, and a release without the asset
      # breaks the README's latest/download link, so a missing key is a thing
      # to fix before tagging, not a thing to find out from a user.
      - name: Restore the release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${ANDROID_KEYSTORE_B64}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 is not set, so this release has no Android APK. Make the key once and keep the keystore outside the repo: keytool -genkeypair -keystore wizard-android.p12 -storetype PKCS12 -alias wizard -keyalg RSA -keysize 4096 -validity 36500 -dname 'CN=Wizard'. Then: base64 -w0 wizard-android.p12 | gh secret set ANDROID_KEYSTORE_B64 --repo ${GITHUB_REPOSITORY}, and gh secret set ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (wizard) and ANDROID_KEY_PASSWORD (the store password, for PKCS12) the same way" >&2
            exit 1
          fi
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} is not set; the Android release needs it alongside ANDROID_KEYSTORE_B64: gh secret set ${name} --repo ${GITHUB_REPOSITORY}" >&2
              exit 1
            fi
          done
          umask 077
          keystore="$RUNNER_TEMP/wizard-android.keystore"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d >"$keystore"
          # Open it now, so a wrong password or alias is reported as that and
          # not as a stack trace from the middle of packageRelease. keytool
          # writes its errors to stdout, hence the capture.
          if ! out="$(keytool -list -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" 2>&1)"; then
            echo "::error::cannot open alias ${ANDROID_KEY_ALIAS} in ANDROID_KEYSTORE_B64 with ANDROID_KEYSTORE_PASSWORD: ${out}" >&2
            exit 1
          fi
          echo "WIZARD_ANDROID_KEYSTORE=$keystore" >>"$GITHUB_ENV"

      # Tests and lint gate the upload the way `test` gates the binaries.
      # testDebugUnitTest because that is the variant the JVM tests are written
      # against; lintRelease because release is what ships.
      - name: Test, lint and build the release APK
        env:
          WIZARD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WIZARD_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WIZARD_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon -Pwizard.version="${GITHUB_REF_NAME#v}" \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      # `apksigner verify` alone would pass an APK signed with the debug key:
      # that is a valid signature too, and the build falls back to it when the
      # signing variables do not arrive. So the certificate is also compared
      # with the one in the keystore, and the version with the tag's.
      - name: Verify the APK's signature, key and version
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          apk=app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/36.1.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" >apksigner.out
          grep -v '^WARNING' apksigner.out | tee apksigner.txt
          grep -qx 'Number of signers: 1' apksigner.txt || { echo "::error::expected exactly one signer" >&2; exit 1; }
          if grep -q '^Signer #1 certificate DN: .*CN=Android Debug' apksigner.txt; then
            echo "::error::the APK is signed with a debug key" >&2
            exit 1
          fi
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apksigner.txt)"
          expected="$(keytool -exportcert -keystore "$WIZARD_ANDROID_KEYSTORE" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | cut -d' ' -f1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::the APK's certificate (${actual}) is not the release keystore's (${expected})" >&2
            exit 1
          fi
          # Pinned: installed copies only accept updates signed by this
          # certificate, so a swapped secret must stop the release, not ship.
          pinned=08a95a0f77e2a9ccc8c4131577c77e02eb52f43648cfeb39d1fcb12455b8bfb5
          if [ "$actual" != "$pinned" ]; then
            echo "::error::the APK's certificate (${actual}) is not the pinned release certificate (${pinned})" >&2
            exit 1
          fi
          # To a file, not piped into head: head exits after one line, aapt2
          # takes a SIGPIPE, and pipefail turns that into a failed step.
          "$tools/aapt2" dump badging "$apk" >badging.txt
          badging="$(head -1 badging.txt)"
          echo "$badging"
          case "$badging" in
            *"versionName='${ver}'"*) ;;
            *) echo "::error::the APK's versionName is not ${ver}" >&2; exit 1 ;;
          esac
          cp "$apk" "wizard-android-${ver}.apk"
          echo "Android APK signed by certificate SHA-256 ${actual}" >>"$GITHUB_STEP_SUMMARY"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/wizard-android.keystore"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-apk
          path: android/wizard-android-*.apk
          if-no-files-found: error

  # The APK and its checksum list, signed by the same key as checksums.txt,
  # attached to the release the way gui-release attaches the GUI. Its own
  # android-checksums.txt rather than a line in gui-checksums.txt, so a GUI
  # build that fails does not take the APK's checksum with it.
  #
  # The release is public before this runs, so for the minutes between
  # `release` and this upload, latest/download/wizard-android.apk 404s. The
  # APK builds in parallel with the wizard matrix and is normally waiting by
  # then, which keeps that window to the length of this job.
  android-release:
    name: Attach the Android APK to the release
    needs: [release, android-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: android-apk
          path: android-dist
      - name: Name the assets and list their checksums
        run: |
          set -eu
          ver="${GITHUB_REF_NAME#v}"
          mkdir out
          cp "android-dist/wizard-android-${ver}.apk" "out/wizard-android-${ver}.apk"
          cp "android-dist/wizard-android-${ver}.apk" out/wizard-android.apk
          (cd out && sha256sum -- *.apk > android-checksums.txt)
          cat out/android-checksums.txt
      - name: Sign the Android checksums
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -eu
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${MINISIGN_SECRET_KEY}" > minisign.key
          minisign -S -s minisign.key -m out/android-checksums.txt \
            -c "wizard ${GITHUB_REF_NAME} android checksums" \
            -t "wizard ${GITHUB_REF_NAME} android checksums, signed by the wizard release key" \
            </dev/null
          rm -f minisign.key
          key="$(grep -v '^untrusted comment:' wizard-release.pub | tr -d '[:space:]')"
          minisign -Vm out/android-checksums.txt -x out/android-checksums.txt.minisig -P "$key"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
