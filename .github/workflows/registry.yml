name: Registry

on:
  push:
    branches: [main]
  pull_request:

# Read-only: validates the in-tree registry, writes nothing back.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  registry:
    name: Registry index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same checks as a local `contrib/check-registry.py`:
      # each manifest.toml validates, each artifact's sha256 matches the
      # published checksum, and registry/registry.json cannot drift from
      # the tree. No Rust toolchain: this is the cheap gate for a
      # skills-only PR.
      - name: Validate registry
        run: python3 contrib/check-registry.py
