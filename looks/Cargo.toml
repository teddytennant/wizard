[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
agent-core = { path = "crates/agent-core" }
tuikit = { path = "crates/tuikit" }
backend-wizard = { path = "crates/backend-wizard" }
backend-claude = { path = "crates/backend-claude" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# The highlighter runs hundreds of regexes per frame; at opt-level 0 the regex engines are ten
# times slower than the code around them.
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
